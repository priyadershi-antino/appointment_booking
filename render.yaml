# Render blueprint — deploys the API only.
#
# The web client lives on Vercel and the database on Neon (see DEPLOY.md), so this
# blueprint provisions just the `booking-api` service rather than a full stack. In
# Render: New > Blueprint > connect this repo. Render reads this file and prompts for the
# `sync: false` values below (DATABASE_URL, FRONTEND_URL) during setup.
#
# Free-tier note: the service sleeps after 15 minutes idle, so the first request after a
# pause takes ~30 seconds to wake.

# Pull-request previews are deliberately off.
#
# A preview instance inherits this service's environment, and the API's start command
# runs `prisma migrate deploy` on every boot. With DATABASE_URL pointing at the real
# database, opening a PR that adds a migration would apply it to production data before
# anyone reviewed the PR. Previews are only safe once each one gets its own database.
previews:
  generation: off

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: booking-api
    runtime: node
    plan: free
    # Ohio, to sit next to the Neon database (us-east-2) rather than cross the Pacific on
    # every query. Change this if your Neon project is in a different region.
    region: ohio
    # Redeploy on every push to the tracked branch. This is the setting that matters for
    # "does it deploy when I push" — previews above are a separate thing entirely.
    autoDeploy: true
    # The Prisma client is generated as TypeScript, so it must be generated BEFORE the
    # TypeScript build rather than after it.
    #
    # `--include=dev` is required: with NODE_ENV=production set (below), plain `npm ci`
    # silently omits devDependencies — which is where typescript and every @types/* package
    # live. Without it the build fails with TS7016 on every third-party import.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace=@booking/shared &&
      npm run db:generate --workspace=@booking/api &&
      npm run build --workspace=@booking/api
    # Migrations run on every boot. `migrate deploy` only applies pending migrations and
    # never resets, so it is safe to run repeatedly — and it is what installs the
    # exclusion constraint that prevents double booking.
    startCommand: >-
      npm run db:migrate:deploy --workspace=@booking/api &&
      npm run start --workspace=@booking/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Neon connection string (Project -> Connection Details -> pooled connection).
      # Must include ?sslmode=require — Neon refuses plaintext connections.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # Vercel proxies /api/v1 through to this service same-origin (see DEPLOY.md), so the
      # session cookie is first-party and `lax` is correct. Only use `none` if the browser
      # is ever pointed directly at this API's own domain.
      - key: COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: info
      # The Vercel production domain — it is the CORS allowlist.
      - key: FRONTEND_URL
        sync: false
