# Render blueprint — deploys the database, API and web client in one go.
#
# In Render: New > Blueprint > connect this repo. Render reads this file, provisions all
# three services, wires the database URL in automatically, and generates the JWT secrets.
#
# Two values cannot be filled in until the services exist, because each needs the other's
# URL. After the first deploy, set them and redeploy both:
#   api  ->  FRONTEND_URL       = https://<your-web-service>.onrender.com
#   web  ->  NEXT_PUBLIC_API_URL = https://<your-api-service>.onrender.com/api/v1
#
# Free-tier notes: services sleep after 15 minutes idle, so the first request after a
# pause takes ~30 seconds to wake. Render's free Postgres expires after 30 days — for
# something longer-lived, create a free Neon database instead and paste its connection
# string into DATABASE_URL rather than using the `databases:` block below.

databases:
  - name: booking-db
    databaseName: booking
    user: booking
    plan: free
    # Must match the services below. A database in another region means every query
    # crosses a continent, and free-tier cross-region access is not guaranteed.
    region: singapore

# Pull-request previews are deliberately off.
#
# A preview instance inherits this service's environment, and the API's start command
# runs `prisma migrate deploy` on every boot. With DATABASE_URL pointing at the real
# database, opening a PR that adds a migration would apply it to production data before
# anyone reviewed the PR. Previews are only safe once each one gets its own database.
previews:
  generation: off

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: booking-api
    runtime: node
    plan: free
    region: singapore
    # Redeploy on every push to the tracked branch. This is the setting that matters for
    # "does it deploy when I push" — previews above are a separate thing entirely.
    autoDeploy: true
    # The Prisma client is generated as TypeScript, so it must be generated BEFORE the
    # TypeScript build rather than after it.
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@booking/shared &&
      npm run db:generate --workspace=@booking/api &&
      npm run build --workspace=@booking/api
    # Migrations run on every boot. `migrate deploy` only applies pending migrations and
    # never resets, so it is safe to run repeatedly — and it is what installs the
    # exclusion constraint that prevents double booking.
    startCommand: >-
      npm run db:migrate:deploy --workspace=@booking/api &&
      npm run start --workspace=@booking/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: booking-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # The web client is on a different origin, so the session cookie must be
      # cross-site or the browser will silently drop it after login.
      - key: COOKIE_SAMESITE
        value: none
      - key: LOG_LEVEL
        value: info
      # Set this to the web service URL after the first deploy — it is the CORS allowlist.
      - key: FRONTEND_URL
        sync: false

  # ── Web ────────────────────────────────────────────────────────────────────
  - type: web
    name: booking-web
    runtime: node
    plan: free
    region: singapore
    autoDeploy: true
    buildCommand: >-
      npm ci &&
      npm run build --workspace=@booking/shared &&
      npm run build --workspace=@booking/web
    # `next start` binds $PORT, which Render assigns and then health-checks. Passing an
    # explicit -p here would bind the wrong port and the deploy would be marked failed.
    startCommand: npm run start --workspace=@booking/web
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # Set this to the API service URL after the first deploy. It is baked into the
      # client bundle at build time, so changing it requires a rebuild, not just a restart.
      - key: NEXT_PUBLIC_API_URL
        sync: false
